name: Update formula

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (default: newest release)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-formula

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo tmuntaner/credential-manager --limit 1 --json tagName --jq '.[0].tagName')
          fi
          [ -n "$tag" ] || { echo "::error::no release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -f Formula/c9s.rb ] && grep -qF "/tags/${tag}.tar.gz" Formula/c9s.rb; then
            echo "Formula already at ${tag}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render formula
        if: steps.tag.outputs.changed == 'true'
        run: scripts/update.sh "${{ steps.tag.outputs.tag }}"

      # Never publish a formula that does not build.
      - name: Verify formula
        if: steps.tag.outputs.changed == 'true'
        run: scripts/verify.sh

      - name: Commit and push
        if: steps.tag.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/c9s.rb
          git commit -m "c9s ${{ steps.tag.outputs.tag }}"
          git push
